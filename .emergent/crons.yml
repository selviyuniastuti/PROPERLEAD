crons:
  - name: oss-auto-sync
    description: "Simulasi ingest OSS: deteksi lead perumahan baru setiap 30 menit"
    cron: "*/30 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/oss-ingest"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: daily-digest
    description: "Kirim ringkasan harian lead baru & KKPR terbit ke email/Telegram tiap 07:30 WITA"
    cron: "30 0 * * *"
    endpoint: "{{BASE_URL}}/api/cron/daily-digest"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
